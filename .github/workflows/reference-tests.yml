name: Reference implementation tests

on:
  push:
    branches: [main, Manansh]
    paths:
      - "reference-implementation/**"
      - ".github/workflows/reference-tests.yml"
  pull_request:
    paths:
      - "reference-implementation/**"
      - ".github/workflows/reference-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run synchronization and switch timing tests
        run: make -C reference-implementation test
